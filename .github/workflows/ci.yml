name: Symfony CI

on:
  push:
    branches: [ "main"]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  phpstan:
    name: Analyse statique de code (PHPStan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ctype, iconv, pdo_sqlite, mbstring, intl
          tools: phpstan, composer:v2
          tools-cache: true

      - name: Installation des dépendances Composer
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Analyse PHPStan
        run: phpstan analyse --no-progress --error-format=table

  phpcs:
    name: Style de code (PHPCS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ctype, iconv, pdo_sqlite, mbstring, intl
          tools: composer:v2

      - name: Installation des dépendances Composer
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Vérification du style de code (PHPCS)
        run: vendor/bin/phpcs -n --standard=phpcs.xml.dist

  tests:
    name: Tests unitaires & Couverture
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ctype, iconv, pdo_sqlite, mbstring, intl
          coverage: pcov
          tools: composer:v2

      - name: Installation des dépendances Composer
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Préparation de la base de données de test
        env:
          DATABASE_URL: "sqlite:///%kernel.project_dir%/var/test.db"
          APP_ENV: test
          APP_SECRET: ${{ secrets.APP_SECRET || 'SecretForCI' }}
          MERCURE_URL: "http://mercure.test/.well-known/mercure"
          MERCURE_PUBLIC_URL: "http://mercure.test/.well-known/mercure"
          MERCURE_JWT_SECRET: "CIOnlyDummyJwtSecretNotUsedForRealAuth"
        run: |
          php bin/console doctrine:schema:create --env=test --no-interaction
          # Volontairement schema:create (pas migrations:migrate) : l'historique de
          # migrations contient encore des doublons de contraintes non nettoyés.
          # À corriger APRÈS l'examen, sans urgence de temps.

      - name: Compilation du CSS Tailwind
        run: php bin/console tailwind:build

      - name: Exécution des tests PHPUnit avec couverture
        env:
          DATABASE_URL: "sqlite:///%kernel.project_dir%/var/test.db"
          APP_ENV: test
          APP_SECRET: ${{ secrets.APP_SECRET || 'SecretForCI' }}
          MERCURE_URL: "http://localhost/.well-known/mercure"
          MERCURE_PUBLIC_URL: "http://localhost/.well-known/mercure"
          MERCURE_JWT_SECRET: "CIOnlyDummyJwtSecretNotUsedForRealAuth"
        run: vendor/bin/phpunit --coverage-clover coverage.xml --coverage-text=coverage.txt --coverage-html coverage-html --testdox

      - name: Vérification du seuil de couverture (10% minimum)
        run: |
          COVERAGE=$(php -r '
            $xml = simplexml_load_file("coverage.xml");
            $metrics = $xml->xpath("//metrics");
            $covered = 0;
            $total = 0;
            foreach ($metrics as $m) {
                $covered += (int) $m["coveredstatements"];
                $total += (int) $m["statements"];
            }
            echo $total > 0 ? round(($covered / $total) * 100, 2) : 0;
          ')
          echo "Couverture actuelle : $COVERAGE%"
          if (( $(echo "$COVERAGE < 10" | bc -l) )); then
            echo "❌ Couverture insuffisante : $COVERAGE% (minimum requis : 10%)"
            exit 1
          else
            echo "✅ Couverture suffisante : $COVERAGE%"
          fi

      - name: Publication du rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage.txt