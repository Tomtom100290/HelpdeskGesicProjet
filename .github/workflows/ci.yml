name: Symfony CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ctype, iconv, pdo_sqlite, mbstring, intl
          coverage: none

      - name: Cache des dépendances Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Installation des dépendances Composer
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Préparation de la base de données de test
        env:
          DATABASE_URL: "sqlite:///%kernel.project_dir%/var/test.db"
          APP_ENV: test
          APP_SECRET: ${{ secrets.APP_SECRET || 'SecretForCI' }}
        run: |
          php bin/console doctrine:schema:create --env=test --no-interaction

      - name: Exécution des tests PHPUnit
        env:
          DATABASE_URL: "sqlite:///%kernel.project_dir%/var/test.db"
          APP_ENV: test
          APP_SECRET: ${{ secrets.APP_SECRET || 'SecretForCI' }}
        run: vendor/bin/phpunit